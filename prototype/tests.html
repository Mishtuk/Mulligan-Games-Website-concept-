  <!-- Look A chrome (D28): charcoal bar with the logo plate, cream page; results use the status colours from tokens.css. -->
  <style>
    body { font: 16px/1.5 var(--font); margin: 0; background: var(--paper); color: var(--ink); }
    .t-bar { display: flex; align-items: center; gap: .75rem; padding: .6rem 1.25rem; background: var(--charcoal); color: var(--on-band); }
    .t-plate { display: inline-flex; padding: 4px 7px; border-radius: var(--r-box); background: var(--plate); }
    .t-plate img { width: 6.25rem; height: auto; display: block; }
    .t-bar a { color: var(--on-band); font-weight: 700; margin-left: auto; }
    main { padding: 1.25rem 1.25rem 4rem; max-width: 60rem; }
    h1 { margin: 0 0 .25rem; font-family: var(--font-cond); font-stretch: var(--wdth-display); font-weight: 900; font-size: 2.25rem; line-height: 1.05; }
    #summary { display: inline-block; padding: .25rem .75rem; border-radius: var(--r-box); font-weight: 800; background: var(--surface-2); }
    #summary.pass { background: var(--ok-bg); color: var(--ok); } #summary.fail { background: var(--bad-bg); color: var(--bad); }
    h2 { margin: 1.5rem 0 .25rem; font-size: 1.1rem; }
    ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-ctl); }
    li { padding: .25rem .6rem; border-bottom: 1px solid var(--line); }
    li:last-child { border-bottom: 0; }
    .mark { display: inline-block; width: 3.2rem; font-weight: 800; font-size: .8rem; }
    .pass .mark { color: var(--ok); } .fail .mark { color: var(--bad); } li.fail { background: var(--bad-bg); }
    pre { margin: .25rem 0 0 3.2rem; white-space: pre-wrap; color: var(--bad); }
    #sandbox { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>
